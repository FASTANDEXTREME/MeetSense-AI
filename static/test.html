<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>MeetSense AI — Test Client</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f5f6fa; }

        #joinScreen {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joinBox {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        button {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            margin-right: 6px;
        }

        #meetingUI { display: none; height: 100vh; }

        #mainLayout { display: flex; height: 100%; }

        #leftPanel { flex: 3; padding: 20px; overflow-y: auto; }

        #videoGrid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
        }

        video {
            width: 100%;
            border-radius: 10px;
            background: black;
        }

        #rightPanel {
            flex: 1;
            background: white;
            padding: 20px;
            overflow-y: auto;
            border-left: 1px solid #eee;
        }

        #summaryBox, #engagementBox {
            background: #f9fafb;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            white-space: pre-wrap;
        }

        #transcript {
            height: 150px;
            overflow-y: auto;
            background: #f1f1f1;
            padding: 10px;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="joinScreen">
    <div id="joinBox">
        <h2>MeetSense AI</h2>
        <input id="roomInput" placeholder="Enter Room ID" />
        <input id="nameInput" placeholder="Enter Your Name" />
        <button onclick="joinMeeting()">Join Meeting</button>
    </div>
</div>

<div id="meetingUI">
    <div id="mainLayout">

        <div id="leftPanel">
            <h3>Video Room</h3>
            <div id="videoGrid"></div>

            <br>
            <button onclick="startSpeaking()">Start Speaking</button>
            <button onclick="stopSpeaking()">Stop</button>
            <button onclick="requestSummary()">Generate Summary</button>

            <h3>Transcript</h3>
            <div id="transcript"></div>
        </div>

        <div id="rightPanel">
            <h3>Meeting Summary</h3>
            <div id="summaryBox">No summary yet...</div>

            <h3>Engagement</h3>
            <div id="engagementBox">0%</div>
        </div>

    </div>
</div>

<script>
let roomId;
let userName;
let transcriptSocket;
let signalingSocket;
let visionSocket;
let localStream;
let peers = {};
let recognition;
const clientId = Math.random().toString(36).substring(2);
const videoGrid = document.getElementById("videoGrid");

function getWsBaseUrl() {
    const isHttps = window.location.protocol === "https:";
    const proto = isHttps ? "wss" : "ws";
    const host = window.location.hostname || "localhost";
    return isHttps ? `${proto}://${window.location.host || host}` : `${proto}://${host}:8000`;
}

function joinMeeting() {
    roomId = (document.getElementById("roomInput").value || "defaultRoom").trim();
    userName = (document.getElementById("nameInput").value || "Guest").trim();

    document.getElementById("joinScreen").style.display = "none";
    document.getElementById("meetingUI").style.display = "block";

    initializeMeeting();
}

function appendTranscriptSafe(speaker, text) {
    const row = document.createElement("div");
    const bold = document.createElement("b");
    bold.textContent = `${speaker}: `;
    const span = document.createElement("span");
    span.textContent = text;
    row.appendChild(bold);
    row.appendChild(span);
    document.getElementById("transcript").appendChild(row);
}

async function initializeMeeting() {
    localStream = await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: true
    });

    const localVideo = document.createElement("video");
    localVideo.srcObject = localStream;
    localVideo.autoplay = true;
    localVideo.muted = true;
    localVideo.playsInline = true;
    videoGrid.appendChild(localVideo);

    const wsBase = getWsBaseUrl();

    transcriptSocket = new WebSocket(`${wsBase}/ws/${encodeURIComponent(roomId)}`);

    transcriptSocket.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "transcript") {
            appendTranscriptSafe(data.speaker, data.text);
        }

        if (data.type === "summary") {
            document.getElementById("summaryBox").textContent =
                JSON.stringify(data.data, null, 2);
        }
    };

    signalingSocket = new WebSocket(
        `${wsBase}/ws/signal/${encodeURIComponent(roomId)}/${encodeURIComponent(clientId)}?name=${encodeURIComponent(userName)}`
    );

    signalingSocket.onmessage = async (event) => {
        const data = JSON.parse(event.data);

        if (data.type === "new_peer") {
            if (!peers[data.client_id]) {
                await createPeerConnection(data.client_id, true);
            }
            return;
        }

        if (data.type === "peer_left") {
            if (peers[data.client_id]) {
                peers[data.client_id].close();
                delete peers[data.client_id];
            }
            const el = document.getElementById("video-" + data.client_id);
            if (el) el.remove();
            return;
        }

        if (data.offer) {
            await createPeerConnection(data.sender, false);
            await peers[data.sender].setRemoteDescription(data.offer);

            const answer = await peers[data.sender].createAnswer();
            await peers[data.sender].setLocalDescription(answer);

            signalingSocket.send(JSON.stringify({
                type: "answer",
                target: data.sender,
                answer: answer
            }));
            return;
        }

        if (data.answer && peers[data.sender]) {
            await peers[data.sender].setRemoteDescription(data.answer);
            return;
        }

        if (data.candidate && peers[data.sender]) {
            await peers[data.sender].addIceCandidate(data.candidate);
        }
    };

    visionSocket = new WebSocket(
        `${wsBase}/ws/vision/${encodeURIComponent(roomId)}/${encodeURIComponent(clientId)}`
    );

    const canvas = document.createElement("canvas");
    canvas.width = 320;
    canvas.height = 240;
    const ctx = canvas.getContext("2d");

    setInterval(() => {
        if (visionSocket.readyState !== WebSocket.OPEN || localVideo.readyState < 2) return;
        ctx.drawImage(localVideo, 0, 0, 320, 240);
        visionSocket.send(canvas.toDataURL("image/jpeg", 0.7));
    }, 2000);

    visionSocket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        document.getElementById("engagementBox").textContent =
            `${data.engagement_score}% (${data.looking_forward ? "Attentive" : "Away"})`;
    };
}

async function createPeerConnection(targetId, isInitiator) {
    if (peers[targetId]) return;

    const peer = new RTCPeerConnection({
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    });

    peers[targetId] = peer;

    localStream.getTracks().forEach(track => {
        peer.addTrack(track, localStream);
    });

    const remoteVideo = document.createElement("video");
    remoteVideo.id = "video-" + targetId;
    remoteVideo.autoplay = true;
    remoteVideo.playsInline = true;
    videoGrid.appendChild(remoteVideo);

    peer.ontrack = (event) => {
        if (!remoteVideo.srcObject) {
            remoteVideo.srcObject = event.streams[0];
        }
    };

    peer.onicecandidate = (event) => {
        if (event.candidate) {
            signalingSocket.send(JSON.stringify({
                type: "ice",
                target: targetId,
                candidate: event.candidate
            }));
        }
    };

    if (isInitiator) {
        const offer = await peer.createOffer();
        await peer.setLocalDescription(offer);

        signalingSocket.send(JSON.stringify({
            type: "offer",
            target: targetId,
            offer: offer
        }));
    }
}

function startSpeaking() {
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.continuous = true;

    transcriptSocket.send(JSON.stringify({
        type: "speaking",
        speaker: userName
    }));

    recognition.onresult = function(event) {
        const text = event.results[event.results.length - 1][0].transcript;

        transcriptSocket.send(JSON.stringify({
            speaker: userName,
            text: text
        }));
    };

    recognition.start();
}

function stopSpeaking() {
    if (recognition) recognition.stop();
    if (transcriptSocket && transcriptSocket.readyState === WebSocket.OPEN) {
        transcriptSocket.send(JSON.stringify({
            type: "stopped_speaking",
            speaker: userName
        }));
    }
}

function requestSummary() {
    if (transcriptSocket && transcriptSocket.readyState === WebSocket.OPEN) {
        transcriptSocket.send(JSON.stringify({ type: "request_summary" }));
    }
}
</script>
</body>
</html>
